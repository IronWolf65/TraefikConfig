http:
  routers:
    pve:
      entryPoints:
        - websecure
      rule: "Host(`pve.ironwolf65.duckdns.org`)"
      service: pve
      middlewares:
        - mid-default-headers
        - mid-https-redirect
  services:
    pve:
      loadBalancer:
        servers:
          - url: "https://192.168.88.2:8006"
        passHostHeader: true