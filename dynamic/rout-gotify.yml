http:
  routers:
    gotify:
      entryPoints:
        - websecure
      rule: "Host(`gotify.ironwolf65.duckdns.org`)"
      service: gotify
      middlewares:
        - mid-default-headers
        - mid-https-redirect
  services:
    gotify:
      loadBalancer:
        servers:
          - url: "http://192.168.88.13:80"
        passHostHeader: true