http:
  routers:
    dashboard:
      entryPoints:
        - websecure
      rule: Host(`traefik.ironwolf65.duckdns.org`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))
      service: api@internal
      middlewares:
        - mid-default-headers
        - mid-authentik
      priority: 10
    dashboard-manifest:
      entryPoints:
        - websecure
      rule: Host(`traefik.ironwolf65.duckdns.org`) && Path(`/dashboard/manifest.json`)
      service: api@internal
      priority: 20
