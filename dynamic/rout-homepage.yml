http:
  routers:
    homepage:
      entryPoints:
        - websecure
      rule: "Host(`homepage.ironwolf65.duckdns.org`)"
      service: homepage
      middlewares:
        - mid-default-headers
        - mid-https-redirect
        - mid-authentik
      priority: 10
    default-router-auth:
      rule: "Host(`homepage.ironwolf65.duckdns.org`) && PathPrefix(`/outpost.goauthentik.io/`)"
      priority: 15
      service: authentik
  services:
    homepage:
      loadBalancer:
        servers:
          - url: "http://192.168.88.12:3000"
        passHostHeader: true