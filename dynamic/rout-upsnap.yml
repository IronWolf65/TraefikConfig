http:
  routers:
    upsnap:
      entryPoints:
        - websecure
      rule: "Host(`upsnap.ironwolf65.duckdns.org`)"
      service: upsnap
      middlewares:
        - mid-default-headers
        - mid-https-redirect
  services:
    upsnap:
      loadBalancer:
        servers:
          - url: "http://192.168.88.16:8090"
        passHostHeader: true